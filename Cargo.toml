[package]
name = "VEIL-WindowManager"
version = "0.1.0"
edition = "2021"
authors = ["Ico2"]
description = "VEIL Tiling Window Manager"
license = "UNLICENSED"
publish = false

[features]
default = ["addon-mode", "ui-runtime"]
addon-mode = []
standalone-mode = []
ui-runtime = ["dep:webview2-com", "dep:wry", "dep:raw-window-handle", "dep:tao"]

[[bin]]
name = "veil-windowmanager-addon"
path = "src/main.rs"
required-features = ["addon-mode"]

[[bin]]
name = "veil-windowmanager-standalone"
path = "src/main.rs"
required-features = ["standalone-mode"]

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32",
    "Win32_Foundation",
    "Win32_UI_Shell", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",    
    "Win32_System", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_WindowsProgramming", "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage", "Win32_Storage_FileSystem",
    "Win32_Security",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.33"
walkdir = "2.5"
chrono = "0.4.43"
log = "0.4"
notify = "8.2.0"
widestring = "1.2.1"
webview2-com = { version = "0.38", optional = true }
wry = { version = "0.54.1", optional = true }
raw-window-handle = { version = "0.6", optional = true }
tao = { version = "0.34.5", optional = true }
once_cell = "1.21.3"

[build-dependencies]
winresource = "0.1"
