<div class="veil-page">
    <div class="veil-page__header">
        <div class="veil-page__eyebrow">Window Manager</div>
        <h1 class="veil-page__title">Dashboard</h1>
        <p class="veil-page__subtitle">Manage tiling, snapping, and per-monitor layout rules.</p>
    </div>

    <div class="veil-stat-grid">
        <div class="veil-stat">
            <span class="veil-stat__label">Active windows</span>
            <span class="veil-stat__value" data-stat="wm-windows">—</span>
            <span class="veil-stat__delta">tracked</span>
        </div>
        <div class="veil-stat">
            <span class="veil-stat__label">Layout rules</span>
            <span class="veil-stat__value" data-stat="wm-rules">—</span>
            <span class="veil-stat__delta">configured</span>
        </div>
        <div class="veil-stat">
            <span class="veil-stat__label">Monitors</span>
            <span class="veil-stat__value" data-stat="wm-monitors">—</span>
            <span class="veil-stat__delta">managed</span>
        </div>
        <div class="veil-stat veil-stat--violet">
            <span class="veil-stat__label">Status</span>
            <span class="veil-stat__value">Enabled</span>
            <span class="veil-stat__delta">addon online</span>
        </div>
    </div>

    <section class="veil-mb-7">
        <h2 class="veil-subtitle veil-mb-3">Quick actions</h2>
        <div class="veil-flex veil-gap-3">
            <button class="veil-btn veil-btn--violet" data-navigate="windowmanager.layouts">
                Manage layouts
            </button>
            <button class="veil-btn">Reload rules</button>
        </div>
    </section>
</div>
